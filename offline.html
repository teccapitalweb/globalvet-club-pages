<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Sin conexión · GlobalVet Club</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    background: #f6f5f1; background-image: radial-gradient(rgba(22,61,40,.09) 1px, transparent 1.3px); background-size: 22px 22px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #163d28; text-align: center; }
  .card { max-width: 380px; padding: 30px 26px 26px; border: 1.5px solid #163d28; border-radius: 18px; background: #fffdf8; box-shadow: 5px 5px 0 #d4a017; }
  img { width: 76px; height: 76px; margin: 0 auto 16px; display: block; border-radius: 20px; }
  .tag { display: inline-block; margin-bottom: 12px; padding: 5px 10px; border: 1.5px solid #163d28; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-size: 26px; line-height: 1.1; margin: 0 0 10px; letter-spacing: -.02em; }
  p { color: #3d5346; max-width: 32ch; margin: 0 auto 20px; line-height: 1.5; font-size: 15px; }
  button { border: 1.5px solid #163d28; border-radius: 12px; padding: 12px 22px; background: #163d28; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: 3px 3px 0 #d4a017; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #d4a017; }
  small { display: block; margin-top: 14px; color: #74837a; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/brand/logo-icon.svg" alt="GlobalVet">
    <span class="tag">Sin conexión</span>
    <h1>Tus cursos te esperan</h1>
    <p>No hay internet ahora mismo. Vuelve a conectarte para abrir cursos, videos y comunidad.</p>
    <button onclick="location.reload()">Reintentar</button>
    <small id="estado">Cuando vuelva la conexión, esta página se recarga sola.</small>
  </div>
  <script>
    window.addEventListener('online', function () { document.getElementById('estado').textContent = 'Conexión recuperada, cargando…'; setTimeout(function () { location.reload(); }, 600); });
  </script>
</body>
</html>
